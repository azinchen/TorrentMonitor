# Live tests through a VPN. Used automatically when tests/env/secrets/vpn.env exists.
# The application and both solvers share the network of the "vpn" container, so
# every request to a tracker leaves through the tunnel.
services:
  vpn:
    image: azinchen/nordvpn-wg:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    env_file:
      - ./secrets/vpn.env
    environment:
      - COUNTRY=${TM_VPN_COUNTRY:-Portugal}
      - GROUP=P2P
      - RANDOM_TOP=10
      - NETWORK=192.168.0.0/16;172.16.0.0/12
      - HEALTHCHECK_ENABLED=true
      - DNS=9.9.9.9;149.112.112.112
    ports:
      - "127.0.0.1:${TM_PORT:-8088}:80"

  app:
    network_mode: service:vpn
    environment:
      # the solvers share the VPN container's network, so they are on localhost
      - TM_SOLVER=${TM_SOLVER:-http://127.0.0.1:8191}
    ports: !reset []
    depends_on:
      vpn:
        condition: service_healthy

  byparr:
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy

  flaresolverr:
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
