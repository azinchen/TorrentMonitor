# Live tests through a VPN. Used automatically when tests/env/secrets/vpn.env exists.
# The application, qBittorrent and both solvers share the network of the "vpn" container, so
# every request to a tracker leaves through the tunnel.
services:
  vpn:
    image: azinchen/nordvpn-wg:${TM_VPN_VERSION:-latest}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    env_file:
      - ./secrets/vpn.env
    environment:
      - COUNTRY=${TM_VPN_COUNTRY:-Portugal}
      - GROUP=P2P
      - RANDOM_TOP=10
      - NETWORK=192.168.0.0/16;172.16.0.0/12
      - HEALTHCHECK_ENABLED=true
      - DNS=9.9.9.9;149.112.112.112
    ports:
      - "127.0.0.1:${TM_PORT:-8088}:80"

  # Keeps the tunnel MTU low. Needed when the host itself is behind another tunnel: with the
  # default 1420 large packets are dropped, so pings work but web requests hang.
  mtu:
    image: tm-tests:php${TM_PHP:-8.5}
    network_mode: service:vpn
    cap_add:
      - NET_ADMIN
    depends_on:
      vpn:
        condition: service_started
    command: ["sh", "-c", "while true; do ip link set dev wg0 mtu ${TM_VPN_MTU:-1280} 2>/dev/null; sleep 15; done"]

  app:
    network_mode: service:vpn
    environment:
      # the solvers and qBittorrent share the VPN container's network, so they are on localhost
      - TM_SOLVER=${TM_SOLVER:-http://127.0.0.1:8191}
      - TM_QBT=http://127.0.0.1:8080
    ports: !reset []
    depends_on:
      vpn:
        condition: service_healthy

  byparr:
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy

  flaresolverr:
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy

  qbittorrent:
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
