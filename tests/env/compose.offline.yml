# Integration tests: tracker host names resolve to the fake server, which answers
# over TLS with a certificate the application container is told to trust.
services:
  fake:
    networks:
      default:
        aliases: [rutracker.org, www.rutracker.org, nnmclub.to]

  # old-format databases for the tests of tools/convert-db.php
  mariadb:
    image: lscr.io/linuxserver/mariadb:${TM_MARIADB_VERSION:-latest}
    environment:
      - PUID=1000
      - PGID=1000
      - MYSQL_ROOT_PASSWORD=tm-test-pass
      - MYSQL_DATABASE=torrentmonitor
      - MYSQL_USER=tm
      - MYSQL_PASSWORD=tm-test-pass
    healthcheck:
      # over TCP: the server that runs during the first setup does not listen on the network
      test: ["CMD-SHELL", "mariadb -h127.0.0.1 -utm -ptm-test-pass torrentmonitor -e 'select 1' > /dev/null 2>&1 || mysql -h127.0.0.1 -utm -ptm-test-pass torrentmonitor -e 'select 1' > /dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 60

  postgres:
    image: postgres:${TM_POSTGRES_VERSION:-latest}
    environment:
      - POSTGRES_DB=torrentmonitor
      - POSTGRES_USER=tm
      - POSTGRES_PASSWORD=tm-test-pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tm -d torrentmonitor"]
      interval: 3s
      timeout: 5s
      retries: 40
